spring.application.name=api-gateway-grupo09

server.port=8070
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.gateway.access=read-only

spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

spring.cloud.gateway.server.webflux.routes[0].id=pedido-service-grupo09
spring.cloud.gateway.server.webflux.routes[0].uri=lb://PEDIDO-SERVICE-GRUPO09
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/pedidos/**

spring.cloud.gateway.server.webflux.routes[1].id=pago-service-grupo09
spring.cloud.gateway.server.webflux.routes[1].uri=lb://PAGO-SERVICE-GRUPO09
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/pagos/**